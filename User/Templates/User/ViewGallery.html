{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery</title>

    <style>
        body {
            background: black;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Title */
        h2 {
            color: white;
            font-size: 60px;
            margin-left: 120px;
            margin-top: 30px;
        }

        /* Back Button */
        .back-btn {
            display: inline-block;
            margin-left: 120px;
            margin-top: 20px;
            padding: 10px 20px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 5px;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 80%;
            margin: auto;
            margin-top: 40px;
        }

        /* Image */
        .gallery img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 3px;
            transition: 0.3s;
        }

        /* Hover effect */
        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <a href="{% url 'User:Proviewmore' id %}" class="back-btn">Back</a>

    <h2>Gallery</h2>

    <form method="post">
        {% csrf_token %}

        <div class="gallery">

            {% for i in data %}
            <img src="{{ i.gallery_photo.url }}" alt="">
            {% endfor %}

        </div>

    </form>

</body>

</html>
