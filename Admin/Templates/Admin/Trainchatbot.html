{% extends 'Admin/Header.html' %}
{% block content %}


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Chatbot</title>


    <style>

/* ===== ADMIN PAGE DESIGN ===== */

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #aac5e0;
}

/* Form spacing */
form {
    margin-top: 30px;
}

/* Page title */
h1{
    text-align:center;
    color:#1f2937;
}

/* Tables */
form table {
    width: 50%;
    margin: 20px auto;
    border-collapse: collapse;
    background: #ffffff;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
}

/* Remove table border */
form table[border] {
    border: none;
}

/* Table cells */
form table td {
    padding: 12px 14px;
    font-size: 14px;
    color: #1f2937;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

/* Header row style */
form table tr:first-child {
    background-color: #2563eb;
    color: #ffffff;
    font-weight: bold;
}

/* Input fields */
form input[type="text"] {
    width: 95%;
    padding: 8px 10px;
    border-radius: 4px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
}

/* Focus effect */
form input[type="text"]:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    outline: none;
}

/* Submit button */
form input[type="submit"] {
    padding: 8px 18px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    background-color: #2563eb;
    color: #ffffff;
}

</style>





</head>

<body>
    <form action="" method="post">
        {% csrf_token %}
        <table border="1" align="center">
            
                    <h1>TrainChatbot</h1>
                    <tr>
        
                    <td>Question</td>
                    <td><input type="text" required name="txt_question" placeholder="Question"></td>
    
                </tr>
                <tr>
                    <td>Answer</td>
                    <td><input type="text" required  name="txt_answer" placeholder="Answer"> </td>
                
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                </td>
            </tr>
        </table>
</body>

</html>



{% if msg %}
<script>
    alert("{{ msg }}");
    window.location = "{% url 'Admin:Trainchatbot' %}";
</script>
{% endif %}

{% endblock content %}
