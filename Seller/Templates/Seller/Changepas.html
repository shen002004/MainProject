
{% extends 'Seller/Header.html' %}
{% block content %}
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANGE PASSWORD</title>

    <style>
        /* Background */

        .change-wrapper {

            background-image: url("{% static 'Main/images/pngtree-living-room-with-a-blue-wall-image_2629404.jpg'%}");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 120px;
            padding-bottom: 60px;

        }


        /* CARD */

        .change-card {

            width: 450px;

            backdrop-filter: blur(20px);
            background: rgba(103, 72, 72, 0.25);

            border-radius: 30px;
            padding: 40px;

            color: white;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);

            text-align: center;

        }


        /* TITLE */

        .change-title {

            font-size: 26px;
            font-weight: 600;
            margin-bottom: 25px;

        }


        /* INPUT GROUP */

        .change-group {

            text-align: left;
            margin-bottom: 18px;

        }

        .change-group label {

            font-weight: 600;
            display: block;
            margin-bottom: 6px;

        }


        /* Password Box */

        .password-box {

            position: relative;

        }

        .password-box input {

            width: 100%;
            padding: 10px;
            padding-right: 40px;

            border-radius: 10px;
            border: none;
            outline: none;

        }


        /* Eye Icon */

        .toggle-eye {

            position: absolute;
            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            color: #333;
            font-size: 18px;

        }


        /* BUTTONS */

        .change-buttons {

            margin-top: 25px;

            display: flex;
            justify-content: center;
            gap: 15px;

            flex-wrap: wrap;

        }


        .change-btn {

            padding: 12px 24px;

            background: white;
            color: black;

            border-radius: 25px;

            border: none;

            font-weight: 600;

            cursor: pointer;

            transition: .3s;

        }


        .change-btn:hover {

            background: black;
            color: white;

        }


        .back-btn {

            padding: 12px 24px;

            background: white;
            color: black;

            border-radius: 25px;

            text-decoration: none;

            font-weight: 600;

            transition: .3s;

        }


        .back-btn:hover {

            background: black;
            color: white;

        }
    </style>



    <div class="change-wrapper">

        <form method="post">

            {% csrf_token %}

            <div class="change-card">

                <div class="change-title">
                    Change Password
                </div>


                <div class="change-group">

                    <label>Old Password</label>

                    <div class="password-box">
                        <input type="password" id="oldpassword" name="txt_oldpassword" required>

                        <i class="fa-solid fa-eye toggle-eye" onclick="togglePassword('oldpassword', this)">
                        </i>

                    </div>

                </div>



                <div class="change-group">

                    <label>New Password</label>

                    <div class="password-box">

                        <input type="password" id="newpassword" name="txt_newpassword" required>

                        <i class="fa-solid fa-eye toggle-eye" onclick="togglePassword('newpassword', this)">
                        </i>

                    </div>

                </div>



                <div class="change-group">

                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input type="password" id="confirmpassword" name="txt_confirmpass" required>

                        <i class="fa-solid fa-eye toggle-eye" onclick="togglePassword('confirmpassword', this)">
                        </i>

                    </div>

                </div>



                <div class="change-buttons">

                    <button type="submit" class="change-btn">
                        Change Password
                    </button>

                    <button type="reset" class="change-btn">
                        Cancel
                    </button>

                    <a href="{% url 'Seller:Myprofile'%}" class="back-btn">
                        Back
                    </a>

                </div>


            </div>

        </form>

    </div>



    <script>

        function togglePassword(fieldId, icon) {

            let passInput = document.getElementById(fieldId);

            if (passInput.type === "password") {

                passInput.type = "text";

                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");

            }
            else {

                passInput.type = "password";

                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");

            }

        }

    </script>



    {% if msg %}
    <script>
        alert("{{msg}}");
        window.location = "{% url 'Seller:Changepas'%}"
    </script>
    {% endif %}

    {% endblock content %}
