{% extends 'Seller/Header.html' %}
{% block content %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Seller Profile</title>


<style>

/* Background */

.edit-wrapper {

background-image: url("{% static 'Main/images/pngtree-living-room-with-a-blue-wall-image_2629404.jpg' %}");
background-position: center;
background-size: cover;
background-repeat: no-repeat;
background-attachment: fixed;

min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding-top: 120px;
padding-bottom: 60px;

}


/* CARD */

.edit-card {

width: 450px;

backdrop-filter: blur(20px);
background: rgba(103, 72, 72, 0.25);

border-radius: 30px;
padding: 40px;

color: white;

box-shadow: 0 20px 50px rgba(0,0,0,0.35);

text-align: center;

}


/* TITLE */

.edit-title {

font-size: 26px;
font-weight: 600;
margin-bottom: 25px;

}


/* IMAGE */

.edit-img img{

width:150px;
height:150px;

border-radius:50%;
border:4px solid white;

object-fit:cover;
margin-bottom:20px;

}


/* INPUT GROUP */

.edit-group {

text-align: left;
margin-bottom: 18px;

}

.edit-group label {

font-weight: 600;
display:block;
margin-bottom:6px;

}

.edit-group input {

width:100%;
padding:10px;

border-radius:10px;
border:none;
outline:none;

}


/* BUTTONS */

.edit-buttons {

margin-top:25px;

display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;

}


.edit-btn {

padding:12px 24px;

background:white;
color:black;

border-radius:25px;

border:none;

font-weight:600;

cursor:pointer;

transition:.3s;

}


.edit-btn:hover {

background:black;
color:white;

}


.back-btn {

padding:12px 24px;

background:white;
color:black;

border-radius:25px;

text-decoration:none;

font-weight:600;

transition:.3s;

}


.back-btn:hover {

background:black;
color:white;

}

</style>



<div class="edit-wrapper">

<form method="post">

{% csrf_token %}

<div class="edit-card">

<div class="edit-title">
Edit Seller Profile
</div>


<div class="edit-img">
<img src="{{sellerdata.seller_photo.url}}">
</div>


<div class="edit-group">
<label>Profile Name</label>
<input type="text" required name="txt_sellername"
value="{{sellerdata.seller_name}}">
</div>


<div class="edit-group">
<label>Email</label>
<input type="email" required name="txt_email"
value="{{sellerdata.seller_email}}">
</div>


<div class="edit-group">
<label>Contact</label>
<input type="text" required name="txt_contact"
value="{{sellerdata.seller_contact}}">
</div>


<div class="edit-group">
<label>Address</label>
<input type="text" name="txt_address"
value="{{sellerdata.seller_address}}">
</div>



<div class="edit-buttons">

<button type="submit" class="edit-btn">
Update Profile
</button>


<a href="{% url 'Seller:Myprofile'%}" class="back-btn">
Back
</a>


</div>


</div>

</form>

</div>


{% if msg %}
<script>
alert("{{msg}}");
window.location="{% url 'Seller:Editprofile'%}"
</script>
{% endif %}

{% endblock content %}
