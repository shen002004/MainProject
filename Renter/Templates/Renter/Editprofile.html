{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editprofile</title>
    <style>

/* BACKGROUND SAME AS SELLER PAGE */

body{
margin:0;
font-family: Arial, Helvetica, sans-serif;

background-image: url("{% static 'Main/images/pngtree-living-room-with-a-blue-wall-image_2629404.jpg' %}");
background-position:center;
background-size:cover;
background-repeat:no-repeat;
background-attachment:fixed;

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}


/* CARD STYLE */

form table:first-of-type{

width:450px;

backdrop-filter: blur(20px);
background: rgba(103, 72, 72, 0.25);

border-radius:30px;
padding:40px;

color:white;

box-shadow:0 20px 50px rgba(0,0,0,0.35);

border:none;

}


/* REMOVE TABLE BORDERS */

table, tr, td{
border:none !important;
}


/* PROFILE IMAGE */

img{

width:150px;
height:150px;

border-radius:50%;
border:4px solid white;

object-fit:cover;

margin-bottom:20px;

}


/* INPUTS */

input[type="text"],
input[type="email"]{

width:100%;
padding:10px;

border-radius:10px;
border:none;
outline:none;

}


/* TABLE TEXT */

td{
padding:12px;
font-size:16px;
color:white;
}


/* UPDATE BUTTON */

.editprofile-btn{

padding:12px 24px;

background:white;
color:black;

border-radius:25px;

border:none;

font-weight:600;

cursor:pointer;

transition:.3s;

}


/* HOVER */

.editprofile-btn:hover{

background:black;
color:white;

}


/* BACK BUTTON CARD */

form table:last-of-type{

width:150px;
margin-top:20px;

backdrop-filter: blur(20px);
background: rgba(103, 72, 72, 0.25);

border-radius:25px;

text-align:center;

}


/* BACK BUTTON */

.profile-action-btn{

padding:10px 20px;

background:white;
color:black;

border-radius:25px;

text-decoration:none;

font-weight:600;

display:inline-block;

transition:.3s;

}

.profile-action-btn:hover{

background:black;
color:white;

}

</style>
</head>
<body>
        <form action="" method="post">
        {% csrf_token %}
        <table border="1" align="center">
            <!-- <h2 class="editprofile-title">Edit Profile</h2> -->
            <tr>
                <td colspan="2" align="center"> <img src="{{renterdata.renter_photo.url}}" width="170" alt=""></td>
            </tr>
            <tr>
                <td>Profile Name</td>
                <td>
                    <input type="text" required name="txt_rentername" id="txt_rentername"
                        value="{{renterdata.renter_name}}">

                </td>
            </tr>
            <tr>
                <td>Email</td>
                <td>
                    <input type="email" required name="txt_email" id="txt_email" value="{{renterdata.renter_email}}">
                </td>
            </tr>
            <tr>
                <td>Contact</td>
                <td>
                    <input type="text" required name="txt_contact" id="txt_contact"
                        value="{{renterdata.renter_contact}}">
                </td>
            </tr>
            <tr>
                <td>Address</td>
                <td>
                    <input type="text" request name="txt_address" id="txt_address"
                        value="{{renterdata.renter_address}}">
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Update Profile" class="editprofile-btn">
                </td>
            </tr>

        </table>
                    <table border="1" align="center">
            <td><a href="{% url 'Renter:Myprofile'%}" class="profile-action-btn">Back</a></td>
            </table>
    </form>
    
</body>
</html>


{% if msg %}
<script>
    alert("{{msg}}");
    window.location = "{% url 'Renter:Editprofile'%}"
</script>
{% endif %}
